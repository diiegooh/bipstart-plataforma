<!doctype html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/svg+xml" href="/bipstart-favicon.svg?v=2">

 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <meta name="theme-color" content="#11091f">
 <title>Área do motoboy • BipStart</title>
 <link rel="stylesheet" href="/cliente.css?v=44">
 <link rel="stylesheet" href="/motoboy.css?v=10">
</head>
<body>
 <header class="top">
  <a class="brand" href="/" aria-label="BipStart"><img class="brand-logo" src="/bipstart-logo.svg" alt="BipStart" width="220"></a>
  <div class="courier-top-actions"><strong>🛵 Área do motoboy</strong><button type="button" id="logout" class="ghost hidden">Sair</button></div>
 </header>
 <main class="courier-wrap">
  <p id="courierMessage" class="notice hidden" role="status"></p>
  <section id="authPanel" class="courier-auth card">
   <span class="kicker">ACESSO INDIVIDUAL</span>
   <h1>Entregas BipStart</h1>
   <p class="muted">Entre com seu usuário (telefone com DDD) e a senha definida pelo responsável da loja.</p>
   <form id="loginForm">
    <label>Usuário (telefone com DDD)<input type="tel" name="login" autocomplete="username" inputmode="tel" placeholder="11999999999" required></label>
    <label>Senha<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="button" id="loginButton">Entrar nas entregas</button>
   </form>
   <div id="captcha" aria-label="Verificação de segurança"></div>
  </section>
  <section id="dashboard" class="hidden">
   <div class="courier-heading">
    <div><span class="kicker">MEUS SERVIÇOS</span><h1>Minhas entregas</h1><p class="muted" id="courierIdentity">Aguardando dados...</p></div>
    <button type="button" id="refresh" class="ghost">Atualizar ↻</button>
   </div>
   <div id="deliveries" class="courier-deliveries"></div>
  </section>
   </div>
  </section>
 </main>
 <script src="/motoboy.js?v=10" defer></script>
</body>
</html>
