name: Testes BipStart
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
