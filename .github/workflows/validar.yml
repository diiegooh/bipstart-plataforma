name: Validar BipStart
on:
  push:
    branches:
      - main
      - feature/contas-supabase-bipstart
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Validar inicializacao do container Docker
        run: |
          docker build -t bipstart-smoke .
          docker run -d --name bipstart-smoke -p 127.0.0.1:33333:3000 bipstart-smoke
          trap 'docker logs bipstart-smoke; docker rm -f bipstart-smoke >/dev/null' EXIT
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:33333/health | grep -q '"ok":true'; then
              echo "Container BipStart responde ao /health"
              exit 0
            fi
            sleep 1
          done
          echo "Container nao respondeu ao /health" >&2
          exit 1
